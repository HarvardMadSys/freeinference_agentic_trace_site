<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paper figures · FreeInference agentic trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="page-title">
      <h1>Paper figures</h1>
      <p class="lede">The paper's figures, redrawn for the weeks and scope you choose.</p>
    </section>
    <section id="selection" class="card" aria-label="Week and scope selection"></section>
    <section id="figures-sessions" class="figure-section" aria-labelledby="sessions-heading">
      <h2 id="sessions-heading">Sessions</h2>
      <div class="card-grid"></div>
    </section>
    <section id="figures-tools" class="figure-section" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools</h2>
      <div class="card-grid"></div>
    </section>
    <section id="figures-caching" class="figure-section" aria-labelledby="caching-heading">
      <h2 id="caching-heading">Prefix caching</h2>
      <div class="card-grid"></div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/figures.js"></script>
</body>
</html>
