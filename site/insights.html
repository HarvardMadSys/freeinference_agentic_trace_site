<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insights · FreeInference Agentic Dataset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <div class="section-heading">
      <h1 id="insights-title">Insights</h1>
    </div>
    <nav id="topic-bar" class="topic-bar" aria-label="Topics"></nav>
    <section id="selection" class="card selection" aria-label="Week and harness selection"></section>
    <section id="structure" class="figure-section" aria-labelledby="structure-heading">
      <h2 id="structure-heading"><span class="topic-number">01</span>Session structure</h2>
      <div class="card-grid"></div>
    </section>
    <section id="tokens" class="figure-section" aria-labelledby="tokens-heading">
      <h2 id="tokens-heading"><span class="topic-number">02</span>Tokens and cost</h2>
      <div class="card-grid"></div>
    </section>
    <section id="latency" class="figure-section" aria-labelledby="latency-heading">
      <h2 id="latency-heading"><span class="topic-number">03</span>Latency</h2>
      <div class="card-grid"></div>
    </section>
    <section id="tools" class="figure-section" aria-labelledby="tools-heading">
      <h2 id="tools-heading"><span class="topic-number">04</span>Tools</h2>
      <div class="card-grid"></div>
    </section>
    <section id="caching" class="figure-section" aria-labelledby="caching-heading">
      <h2 id="caching-heading"><span class="topic-number">05</span>Prefix caching</h2>
      <div class="card-grid"></div>
    </section>
    <section id="comparison" class="figure-section" aria-labelledby="comparison-heading">
      <h2 id="comparison-heading"><span class="topic-number">06</span>Human-driven against benchmark</h2>
      <div class="card-grid"></div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/insights.js"></script>
</body>
</html>
