<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore · FreeInference agentic trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="page-title">
      <h1>Explore the trace</h1>
      <p class="lede">Weeks of coding and assistant agents: pick weeks, see how they are distributed, see the paper's figures for them, open a session.</p>
    </section>
    <section id="selection" class="card selection" aria-label="Week and harness selection"></section>
    <section id="trends" class="card" aria-label="Weekly trends"></section>
    <section id="headline" aria-label="Headline numbers"></section>
    <section id="distributions" class="card-grid" aria-label="Distributions"></section>
    <section id="figures-sessions" class="figure-section" aria-labelledby="sessions-heading">
      <h2 id="sessions-heading">Sessions figures</h2>
      <div class="card-grid"></div>
    </section>
    <section id="figures-tools" class="figure-section" aria-labelledby="tools-heading">
      <h2 id="tools-heading">Tools figures</h2>
      <div class="card-grid"></div>
    </section>
    <section id="figures-caching" class="figure-section" aria-labelledby="caching-heading">
      <h2 id="caching-heading">Prefix caching figures</h2>
      <div class="card-grid"></div>
    </section>
    <section id="figures-comparison" class="figure-section" aria-labelledby="comparison-heading">
      <h2 id="comparison-heading">Benchmark against production figures</h2>
      <div class="card-grid"></div>
    </section>
    <section id="sessions" class="card" aria-label="Sessions table"></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/explore.js"></script>
</body>
</html>
