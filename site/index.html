<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeInference Agentic Dataset</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-grid">
        <div id="hero" class="hero-copy"></div>
        <div id="stats" class="stats-card"></div>
      </div>
    </section>
    <section id="overview" class="overview" aria-labelledby="overview-title">
      <div class="section-heading">
        <h2 id="overview-title">Overview</h2>
      </div>
      <div id="mixes" class="donut-grid"></div>
      <div id="trends" class="trend-grid"></div>
    </section>
    <section id="sessions" class="figure-section" aria-labelledby="session-list-heading">
      <div class="section-heading">
        <h2 id="session-list-heading">Session Explorer</h2>
        <p class="section-guide">Click a session to open its requests, context and timeline.</p>
      </div>
      <div id="sessions-table" class="card"></div>
    </section>
    <section id="insights" class="figure-sections" aria-labelledby="insights-title">
      <div class="section-heading">
        <h2 id="insights-title">Insights</h2>
      </div>
      <div id="topic-tabs" class="topic-tabs" role="tablist" aria-label="Topics"></div>
      <section id="insights-sessions" class="figure-section" role="tabpanel" aria-labelledby="tab-insights-sessions">
        <h2 id="sessions-heading"><span class="topic-number" aria-hidden="true">01</span> Session structure</h2>
        <div class="card-grid"></div>
      </section>
      <section id="insights-tokens" class="figure-section" role="tabpanel" aria-labelledby="tab-insights-tokens">
        <h2 id="tokens-heading"><span class="topic-number" aria-hidden="true">02</span> Tokens and cost</h2>
        <div class="card-grid"></div>
      </section>
      <section id="insights-latency" class="figure-section" role="tabpanel" aria-labelledby="tab-insights-latency">
        <h2 id="latency-heading"><span class="topic-number" aria-hidden="true">03</span> Latency</h2>
        <div class="card-grid"></div>
      </section>
      <section id="insights-tools" class="figure-section" role="tabpanel" aria-labelledby="tab-insights-tools">
        <h2 id="tools-heading"><span class="topic-number" aria-hidden="true">04</span> Tools</h2>
        <div class="card-grid"></div>
      </section>
      <section id="insights-caching" class="figure-section" role="tabpanel" aria-labelledby="tab-insights-caching">
        <h2 id="caching-heading"><span class="topic-number" aria-hidden="true">05</span> Prefix caching</h2>
        <div class="card-grid"></div>
      </section>
      <section id="insights-comparison" class="figure-section" role="tabpanel" aria-labelledby="tab-insights-comparison">
        <h2 id="comparison-heading"><span class="topic-number" aria-hidden="true">06</span> Human-driven against benchmark</h2>
        <div class="card-grid"></div>
      </section>
    </section>
    <section id="cite" class="section cite" aria-labelledby="cite-title">
      <div>
        <h2 id="cite-title">Cite</h2>
      </div>
      <div class="cite-copy-column">
        <p id="cite-line">If the trace supports your work, please cite the paper that introduces it.</p>
        <figure class="cite-block">
          <figcaption>
            <span>BibTeX · FreeInference Agentic Dataset</span>
            <button class="cite-copy" type="button" data-copy="bibtex" hidden>Copy</button>
          </figcaption>
          <pre id="bibtex"><code>@misc{freeinference2026requests,
  title        = {From Requests to Sessions: A Large-Scale Characterization
                  of Human-Driven Agentic Workloads},
  author       = {Nixon, William and Tian, Muxin and Zheng, Yunjia
                  and Gunawi, Haryadi S. and Yang, Juncheng},
  year         = {2026},
  howpublished = {\url{https://data.freeinference.org/pdf/paper/from-requests-to-sessions.pdf}}
}</code></pre>
        </figure>
      </div>
    </section>
    <section id="team" class="section team" aria-labelledby="team-title"></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/explore.js"></script>
</body>
</html>
