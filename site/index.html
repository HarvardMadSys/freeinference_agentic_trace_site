<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore · FreeInference agentic trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-grid">
        <div id="hero" class="hero-copy"></div>
        <div id="stats" class="stats-card"></div>
      </div>
    </section>
    <section id="selection" class="card selection" aria-label="Week and harness selection"></section>
    <section id="overview" class="overview" aria-label="Overview">
      <div id="mixes" class="donut-grid"></div>
      <div id="trends" class="trend-grid"></div>
    </section>
    <section id="figures" class="figure-sections" aria-label="Figures">
      <section id="figures-sessions" class="figure-section" aria-labelledby="sessions-heading">
        <h2 id="sessions-heading">Sessions</h2>
        <div class="card-grid"></div>
      </section>
      <section id="figures-tokens" class="figure-section" aria-labelledby="tokens-heading">
        <h2 id="tokens-heading">Tokens and cost</h2>
        <div class="card-grid"></div>
      </section>
      <section id="figures-latency" class="figure-section" aria-labelledby="latency-heading">
        <h2 id="latency-heading">Latency</h2>
        <div class="card-grid"></div>
      </section>
      <section id="figures-tools" class="figure-section" aria-labelledby="tools-heading">
        <h2 id="tools-heading">Tools</h2>
        <div class="card-grid"></div>
      </section>
      <section id="figures-caching" class="figure-section" aria-labelledby="caching-heading">
        <h2 id="caching-heading">Prefix caching</h2>
        <div class="card-grid"></div>
      </section>
      <section id="figures-comparison" class="figure-section" aria-labelledby="comparison-heading">
        <h2 id="comparison-heading">Human-driven against benchmark</h2>
        <div class="card-grid"></div>
      </section>
    </section>
    <section id="sessions" class="figure-section" aria-labelledby="session-list-heading">
      <h2 id="session-list-heading">Session list</h2>
      <div id="sessions-table" class="card"></div>
    </section>
    <section id="cite" class="section cite" aria-labelledby="cite-title">
      <div>
        <p class="eyebrow"><span class="eyebrow-mark" aria-hidden="true"></span>Citation</p>
        <h2 id="cite-title">Cite this data</h2>
      </div>
      <div class="cite-copy-column">
        <p id="cite-line">If the trace supports your work, please cite the paper that introduces it.</p>
        <figure class="cite-block">
          <figcaption>
            <span>BibTeX · FreeInference agentic trace</span>
            <button class="cite-copy" type="button" data-copy="bibtex" hidden>Copy</button>
          </figcaption>
          <pre id="bibtex"><code>@article{freeinference2026requests,
  title  = {From Requests to Sessions: A Large-Scale Characterization
            of Human-Driven Agentic Workloads},
  author = {Nixon, William and Tian, Muxin and Zheng, Yunjia
            and Gunawi, Haryadi S. and Yang, Juncheng},
  year   = {2026}
}</code></pre>
        </figure>
      </div>
    </section>
    <section id="team" class="section team" aria-labelledby="team-title"></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/explore.js"></script>
</body>
</html>
