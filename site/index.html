<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FreeInference Agentic Dataset</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>
  <main class="page">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-grid">
        <div id="hero" class="hero-copy"></div>
        <div id="stats" class="stats-card"></div>
      </div>
    </section>
    <section id="selection" class="card selection" aria-label="Week and harness selection"></section>
    <section id="overview" class="overview" aria-labelledby="overview-title">
      <div class="section-heading">
        <h2 id="overview-title">Overview</h2>
      </div>
      <div id="mixes" class="donut-grid"></div>
      <div id="trends" class="trend-grid"></div>
    </section>
    <section id="cite" class="section cite" aria-labelledby="cite-title">
      <div>
        <h2 id="cite-title">Cite</h2>
      </div>
      <div class="cite-copy-column">
        <p id="cite-line">If the trace supports your work, please cite the paper that introduces it.</p>
        <figure class="cite-block">
          <figcaption>
            <span>BibTeX · FreeInference Agentic Dataset</span>
            <button class="cite-copy" type="button" data-copy="bibtex" hidden>Copy</button>
          </figcaption>
          <pre id="bibtex"><code>@misc{freeinference2026requests,
  title        = {From Requests to Sessions: A Large-Scale Characterization
                  of Human-Driven Agentic Workloads},
  author       = {Nixon, William and Tian, Muxin and Zheng, Yunjia
                  and Gunawi, Haryadi S. and Yang, Juncheng},
  year         = {2026},
  howpublished = {\url{https://data.freeinference.org/pdf/paper/from-requests-to-sessions.pdf}}
}</code></pre>
        </figure>
      </div>
    </section>
    <section id="team" class="section team" aria-labelledby="team-title"></section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/pages/overview.js"></script>
</body>
</html>
