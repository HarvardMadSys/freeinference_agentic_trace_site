[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freeinference-site"
version = "0.1.0"
description = "The FreeInference agentic trace, visualized: a static site that draws the trace's insights and opens any session."
requires-python = ">=3.12"
dependencies = [
    "agentic-pipeline",  # the release's reader and every definition the site shows; `make setup` installs it from its repository
    "pyarrow>=25",       # the site's data files are Parquet
    "pandas>=3",         # the pipeline's definitions work on data frames
    "duckdb>=1.3",       # runs the site's queries for the default selection's answers, as the browser runs them
]

[project.optional-dependencies]
test = [
    "pytest>=9",
]
browser = ["playwright>=1.50"]  # opens the served pages in a headless browser to check them

[tool.setuptools.packages.find]
include = ["site_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
